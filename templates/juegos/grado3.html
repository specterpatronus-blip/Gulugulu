<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Minijuegos 3º Grado - Gulugulu</title>
<link rel="icon" href="/static/images/icono.png" type="image/png">
<link href="/static/css/fonts/plus-jakarta-sans.css" rel="stylesheet"/>
<link href="/static/css/fonts/material-symbols.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<script src="/static/js/vue.global.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
    --gulu:#5A9AB5;
    --gulu-dark:#2C4A58;
    --gulu-accent:#6366f1;
    --text:#1A2E35;
    --glass:rgba(255,255,255,.85);
    --hglass:rgba(255,255,255,.7);
    --font-display: 'Instrument Serif', serif;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fbff;color:var(--text);overflow-x:hidden;min-height:100vh}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.bg-container{position:fixed;inset:0;z-index:-3;overflow:hidden}
.bg-webp{width:100%;height:100%;object-fit:cover;will-change:transform;transform:translateZ(0);backface-visibility:hidden}
.bg-blur{position:fixed;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.1) 40%,transparent 100%);pointer-events:none}
.header{position:sticky;top:0;z-index:100;padding:12px 24px;background:var(--hglass);border-bottom:1px solid rgba(255,255,255,.4);box-shadow:0 4px 30px rgba(0,0,0,.03);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;transition:transform .3s ease}
.logo:hover{transform:scale(1.02)}
.logo img{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.logo span {
    font-size: 1.6rem;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, var(--gulu), var(--gulu-accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.header-link{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:14px;font-size:.85rem;font-weight:700;color:var(--gulu-dark);border:1px solid rgba(0,0,0,.05);background:rgba(255,255,255,.4);transition:all .3s ease}
.header-link:hover{background:#fff;transform:translateY(-2px);box-shadow:0 8px 15px rgba(0,0,0,.05);border-color:var(--gulu)}
#game-app{max-width:1000px;margin:40px auto;padding:20px;position:relative;z-index:1}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--glass);padding:20px 30px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.05);border:1px solid rgba(255,255,255,.8);margin-bottom:40px}
.level-info h1{font-size:2rem;font-weight:800;color:#0056D2;margin-bottom:4px}
.level-info p{font-size:1rem;color:#64748b;font-weight:600}
.stats{display:flex;gap:20px}
.stat-box{background:#fff;padding:10px 20px;border-radius:16px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.04);border:2px solid #e2e8f0}
.stat-box.hi{border-color:#3B82F6;background:#EFF6FF}
.stat-box span{font-size:.85rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.stat-box strong{font-size:1.5rem;font-weight:800;color:var(--text)}
.canvas{background:var(--glass);border-radius:30px;padding:50px;min-height:500px;box-shadow:0 15px 50px rgba(0,0,0,.05);border:2px solid rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.prompt{font-size:2.5rem;font-weight:800;color:#111827;text-align:center;margin-bottom:40px}
.btn-opt{padding:20px 40px;font-size:2.2rem;font-weight:800;background:#fff;border:4px solid #CBD5E1;border-radius:20px;color:var(--text);box-shadow:0 8px 15px rgba(0,0,0,.05);transition:all .2s ease}
.btn-opt:hover{transform:translateY(-5px);border-color:#3B82F6;box-shadow:0 15px 25px rgba(59,130,246,0.2);color:#3B82F6}
.opts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;width:100%;max-width:600px}
.planet-box{padding:15px 25px;background:#fff;border:3px solid #e2e8f0;border-radius:15px;margin:10px;cursor:pointer;font-size:1.2rem;font-weight:700;transition:.2s}
.planet-box:hover{border-color:var(--gulu);transform:scale(1.05)}
.planet-box.placed{opacity:.3;pointer-events:none}
.drop-zone{min-height:60px;width:100%;max-width:500px;border:3px dashed #cbd5e1;border-radius:15px;margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;padding:15px;justify-content:center}
.placed-item{padding:8px 15px;background:var(--gulu);color:#fff;border-radius:10px;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-content{background:#fff;padding:50px 40px;border-radius:30px;text-align:center;max-width:450px;width:90%;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:popIn .25s cubic-bezier(.34,1.56,.64,1) both}
.modal-icon{font-size:80px;margin-bottom:20px;background:linear-gradient(135deg,#F59E0B,#FCD34D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-content h2{font-size:2.5rem;color:#111827;margin-bottom:10px;font-weight:800}
.modal-content p{font-size:1.1rem;color:#64748b;margin-bottom:30px}
.btn-primary{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-size:1.2rem;font-weight:800;border-radius:99px;cursor:pointer;box-shadow:0 10px 20px rgba(37,99,235,0.3);transition:all .2s;text-decoration:none}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 15px 25px rgba(37,99,235,0.4)}
[v-cloak]{display:none}
@keyframes popIn{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

@keyframes shake-anim {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-8px); }
    40%     { transform: translateX(8px); }
    60%     { transform: translateX(-6px); }
    80%     { transform: translateX(6px); }
}
.shake-anim { animation: shake-anim .35s ease; }

        @media (max-width: 768px) {
            .hide-mobile {
                display: none;
            }
        }
</style>
    <script src="/static/js/fullscreen.js"></script>
</head>
<body>
<div class="bg-container"><img src="/static/videos/fondo.webp" alt="" class="bg-webp" aria-hidden="true"/></div>
<div class="bg-blur"></div>
<header class="header">
        <div style="display: flex; gap: 12px; align-items: center;">
            <button onclick="toggleFullScreen()" class="header-link" style="cursor: pointer; font-family: inherit; background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(0, 0, 0, 0.05);">
                <span class="material-symbols-outlined" id="fullscreenIcon"
                    style="font-size:18px;font-variation-settings:'FILL' 0,'wght' 400">fullscreen</span>
                <span id="fullscreenText" class="hide-mobile">Pantalla Completa</span>
            </button>
  <a href="/" class="logo"><img src="/static/images/icono.png" alt="Gulu"/><span>gulugulu</span></a>
  <a href="/minijuegos" class="header-link"><span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>Grados</a>
        </div>
</header>

<div id="game-app" v-cloak>
  <div class="top-bar" v-if="config">
    <div class="level-info">
      <h1>[[ config.title ]]</h1>
      <p>Juego [[ gameId ]] de 20 &bull; Tercer Grado</p>
    </div>
    <div class="stats">
      <div class="stat-box hi"><span>Progreso</span><strong>[[ gameId ]]/20</strong></div>
      <div class="stat-box" v-if="config.showScore"><span>Puntos</span><strong>[[ score ]]/[[ config.maxScore ]]</strong></div>
    </div>
  </div>

  <div class="canvas" id="canvas-area" v-if="!gameWon && !gameLost">
    <template v-if="gameId===1">
      <div class="prompt">¿Cuánto es [[ g.a ]] × [[ g.b ]]?</div>
      <div class="opts-grid">
        <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG1(o)">[[ o ]]</button>
      </div>
    </template>

    <template v-if="gameId===2">
      <div class="prompt">Si repartes [[ g.a ]] entre [[ g.b ]], ¿cuántos tocan?</div>
      <div class="opts-grid">
        <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG2(o)">[[ o ]]</button>
      </div>
    </template>

    <template v-if="gameId===3">
      <div class="prompt">Fracción equivalente a [[ g.num ]]/[[ g.den ]]</div>
      <div class="opts-grid">
        <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG3(o)">[[ o ]]</button>
      </div>
    </template>

    <template v-if="gameId===4">
      <div class="prompt">Ordena los planetas desde el Sol <span v-html="GIconEngine.html('saturn', { size: 48 })" style="display:inline-block;vertical-align:middle"></span></div>
      <div style="display:flex;flex-wrap:wrap;justify-content:center">
        <div class="planet-box" v-for="p in g.shuffled" :key="p" :class="{placed: g.placed.includes(p)}" @click="pG4(p)" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <span v-html="GIconEngine.parsePlanet(p, { size: 48 }).svg"></span>
          <span>[[ GIconEngine.parsePlanet(p).name ]]</span>
        </div>
      </div>
      <div class="drop-zone">
        <div class="placed-item" v-for="(p,i) in g.placed" :key="i" style="display: flex; align-items: center; gap: 6px;">
          [[ i+1 ]]. <span v-html="GIconEngine.parsePlanet(p, { size: 24 }).svg"></span> [[ GIconEngine.parsePlanet(p).name ]]
        </div>
      </div>
    </template>

    <template v-if="gameId===5">
      <div class="prompt">Verbo "[[ g.data[g.idx].inf ]]" en [[ g.data[g.idx].t ]]</div>
      <div class="sub-prompt">Pregunta [[ g.idx+1 ]] de 5</div>
      <div class="opts-grid">
        <button class="btn-opt sm" v-for="o in g.opts" :key="o" @click="pG5(o)">[[ o ]]</button>
      </div>
    </template>

    <template v-if="gameId===6">
      <div class="prompt">Antónimo de "[[ g.data[g.idx].w ]]"</div>
      <div class="sub-prompt">Pregunta [[ g.idx+1 ]] de 5</div>
      <div class="opts-grid">
        <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG6(o)">[[ o ]]</button>
      </div>
    </template>

    <template v-if="gameId===7">
      <div class="prompt">Perímetro de un [[ g.shape ]] de lados [[ g.sides.join(', ') ]]</div>
      <div class="opts-grid">
        <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG7(o)">[[ o ]]</button>
      </div>
    </template>

    <template v-if="gameId===8">
      <div class="prompt">La [[ g.data[g.idx].n ]] ([[ g.data[g.idx].e ]]) está en estado...</div>
      <div class="opts-grid">
        <button class="btn-opt" @click="pG8('sólido')">Sólido</button>
        <button class="btn-opt" @click="pG8('líquido')">Líquido</button>
        <button class="btn-opt" @click="pG8('gaseoso')">Gaseoso</button>
      </div>
    </template>

    <template v-if="gameId===9">
        <div class="prompt">[[ g.clue ]]</div>
        <div class="opts-grid">
          <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG9(o)">[[ o ]]</button>
        </div>
    </template>

    <template v-if="gameId===10">
        <div class="prompt">Ordena la cadena alimentaria</div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center">
          <div class="planet-box" v-for="p in g.shuffled" :key="p" :class="{placed: g.placed.includes(p)}" @click="pG10(p)" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <span v-html="GIconEngine.parseChain(p, { size: 48 }).svg"></span>
            <span>[[ GIconEngine.parseChain(p).name ]]</span>
          </div>
        </div>
        <div class="drop-zone">
          <div class="placed-item" v-for="(p,i) in g.placed" :key="i" style="display: flex; align-items: center; gap: 6px;">
            [[ i+1 ]]. <span v-html="GIconEngine.parseChain(p, { size: 24 }).svg"></span> [[ GIconEngine.parseChain(p).name ]]
          </div>
        </div>
    </template>

    <template v-if="gameId===11">
        <div class="prompt">Siguiente número: [[ g.a ]], [[ g.b ]], ...</div>
        <div class="opts-grid">
          <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG11(o)">[[ o ]]</button>
        </div>
    </template>

    <template v-if="gameId===12">
        <div class="prompt">"[[ g.data[g.idx].w ]]" es un...</div>
        <div class="sub-prompt">Pregunta [[ g.idx+1 ]] de 5</div>
        <div class="opts-grid">
          <button class="btn-opt" @click="pG12('Sustantivo')">Sustantivo</button>
          <button class="btn-opt" @click="pG12('Verbo')">Verbo</button>
          <button class="btn-opt" @click="pG12('Adjetivo')">Adjetivo</button>
        </div>
    </template>

    <template v-if="gameId===13">
        <div class="prompt">Si son las [[ g.h1 ]]:00 y pasan [[ g.add ]] horas, serán las...</div>
        <div class="opts-grid">
          <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG13(o)">[[ o ]]:00</button>
        </div>
    </template>

    <template v-if="gameId===14">
        <div class="prompt">Sinónimo de [[ g.word ]]</div>
        <div class="opts-grid">
          <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG14(o)">[[ o ]]</button>
        </div>
    </template>

    <template v-if="gameId===15">
        <div class="prompt">[[ g.a ]] × [[ g.b ]] = ?</div>
        <div class="opts-grid">
          <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG15(o)">[[ o ]]</button>
        </div>
    </template>

    <template v-if="gameId===16">
        <div class="prompt">Completa "[[ g.data[g.idx].w ]]"</div>
        <div class="sub-prompt">Pregunta [[ g.idx+1 ]] de 5</div>
        <div class="opts-grid">
          <button class="btn-opt" @click="pG16('C')">C</button>
          <button class="btn-opt" @click="pG16('S')">S</button>
          <button class="btn-opt" @click="pG16('Z')">Z</button>
        </div>
    </template>

    <template v-if="gameId===17">
        <div class="prompt">[[ g.a ]] ___ [[ g.b ]]</div>
        <div class="opts-grid">
          <button class="btn-opt" @click="pG17('>')">></button>
          <button class="btn-opt" @click="pG17('<')"><</button>
        </div>
    </template>

    <template v-if="gameId===18">
        <div class="prompt">Parte de la planta: [[ g.clue ]] <span v-html="GIconEngine.fromEmojiHtml(g.emoji, { size: 48 })" style="display:inline-block;vertical-align:middle"></span></div>
        <div class="opts-grid">
          <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG18(o)">[[ o ]]</button>
        </div>
    </template>

    <template v-if="gameId===19">
        <div class="prompt">Si el Sol sale por el Este, ¿por dónde se oculta?</div>
        <div class="opts-grid">
          <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG19(o)">[[ o ]]</button>
        </div>
    </template>

    <template v-if="gameId===20">
        <div class="prompt">[[ g.clue ]]</div>
        <div class="opts-grid">
          <button class="btn-opt" v-for="o in g.opts" :key="o" @click="pG20(o)">[[ o ]]</button>
        </div>
    </template>
  </div>

  <transition name="fade">
    <div class="modal-overlay" v-if="gameWon || gameLost">
      <div class="modal-content">
        <template v-if="gameWon">
          <span class="material-symbols-outlined modal-icon">stars</span>
          <h2>[[ winMsg ]]</h2>
          <p v-if="gameId < 20">¡Respuesta correcta! Sigue así.</p>
          <div v-else>
            <h2>¡Reto Completado! 🏆</h2>
            <p style="font-size: 1.5rem; margin: 20px 0;">Tu nota final es: <strong>[[ totalScore ]]/20</strong></p>
            <p v-if="totalScore >= 18">¡Eres un experto total!</p>
            <p v-else-if="totalScore >= 12">¡Buen trabajo, sigue practicando!</p>
            <p v-else>¡No te rindas, puedes mejorar!</p>
          </div>
          <a v-if="gameId < 20" :href="'/juego/3/'+(gameId+1)" class="btn-primary">Siguiente Juego</a>
          <a v-else href="/minijuegos" class="btn-primary">Volver a Grados</a>
        </template>
        <template v-else>
          <span class="material-symbols-outlined modal-icon" style="background:linear-gradient(135deg,#EF4444,#B91C1C);-webkit-background-clip:text">error</span>
          <h2>[[ loseMsg ]]</h2>
          <p v-if="g.ans">La respuesta correcta era: <strong>[[ g.ans ]]</strong></p>
          <p v-else>No te preocupes, ¡aprende de este error!</p>
          
          <div v-if="gameId === 20" style="margin-top: 20px;">
            <h2>¡Reto Completado! 🏆</h2>
            <p style="font-size: 1.5rem; margin: 20px 0;">Tu nota final es: <strong>[[ totalScore ]]/20</strong></p>
          </div>

          <a v-if="gameId < 20" :href="'/juego/3/'+(gameId+1)" class="btn-primary">Siguiente Juego</a>
          <a v-else href="/minijuegos" class="btn-primary">Volver a Grados</a>
        </template>
      </div>
    </div>
  </transition>
</div>

<script>window.GAME_ID = parseInt("{{ game_id|default(1) }}", 10);</script>
<script src="/static/js/game-icons.js"></script>
<script src="/static/js/juegos/grado3/{{ game_id|default(1) }}.js"></script>
<script src="/static/js/juegos/grado3/engine.js"></script>
</body>
</html>
