<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Minijuegos 4º Grado - Gulugulu</title>
<link rel="icon" href="/static/images/icono.png" type="image/png">
<link href="/static/css/fonts/plus-jakarta-sans.css" rel="stylesheet"/>
<link href="/static/css/fonts/material-symbols.css" rel="stylesheet"/>
<script src="/static/js/vue.global.js"></script>
<script src="/static/js/gsap.min.js"></script>
<script src="/static/js/confetti.browser.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gulu:#5A9AB5;--gulu-dark:#2C4A58;--gulu-accent:#6366f1;--text:#1A2E35;--glass:rgba(255,255,255,.85);--hglass:rgba(255,255,255,.7);--blue:#3B82F6}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fbff;color:var(--text);overflow-x:hidden;min-height:100vh}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer;border:none}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.bg-container{position:fixed;inset:0;z-index:-3;overflow:hidden}
.bg-webp{width:100%;height:100%;object-fit:cover}
.bg-blur{position:fixed;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.1) 40%,transparent 100%);pointer-events:none}
.header{position:sticky;top:0;z-index:100;padding:12px 24px;backdrop-filter:blur(15px) saturate(180%);background:var(--hglass);border-bottom:1px solid rgba(255,255,255,.4);box-shadow:0 4px 30px rgba(0,0,0,.03);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}.logo:hover{transform:scale(1.02)}
.logo img{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.logo span{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--gulu),var(--gulu-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-link{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:14px;font-size:.85rem;font-weight:700;color:var(--gulu-dark);border:1px solid rgba(0,0,0,.05);background:rgba(255,255,255,.4);backdrop-filter:blur(5px);transition:all .3s}
.header-link:hover{background:#fff;transform:translateY(-2px);box-shadow:0 8px 15px rgba(0,0,0,.05);border-color:var(--gulu)}
#game-app{max-width:1000px;margin:40px auto;padding:20px;position:relative;z-index:1}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(20px);padding:20px 30px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.05);border:1px solid rgba(255,255,255,.8);margin-bottom:40px}
.level-info h1{font-size:2rem;font-weight:800;color:#2563EB;margin-bottom:4px}
.level-info p{font-size:1rem;color:#64748b;font-weight:600}
.stats{display:flex;gap:20px}
.stat-box{background:#fff;padding:10px 20px;border-radius:16px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.04);border:2px solid #e2e8f0}
.stat-box.hi{border-color:var(--blue);background:#EFF6FF}
.stat-box span{font-size:.85rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.stat-box strong{font-size:1.5rem;font-weight:800;color:var(--text)}
.canvas{background:var(--glass);backdrop-filter:blur(10px);border-radius:30px;padding:50px;min-height:500px;box-shadow:0 15px 50px rgba(0,0,0,.05);border:2px solid rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.prompt{font-size:2rem;font-weight:800;color:#111827;text-align:center;margin-bottom:30px}
.sub-prompt{font-size:1.2rem;font-weight:700;color:#64748b;margin-bottom:20px;text-align:center}
.opts{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.btn-opt{padding:18px 36px;font-size:1.6rem;font-weight:800;background:#fff;border:4px solid #CBD5E1;border-radius:20px;color:var(--text);box-shadow:0 8px 15px rgba(0,0,0,.05);transition:all .2s cubic-bezier(.16,1,.3,1)}
.btn-opt:hover{transform:translateY(-5px);border-color:var(--blue);box-shadow:0 15px 25px rgba(59,130,246,.2);color:var(--blue)}
.btn-opt.sm{font-size:1.1rem;padding:14px 24px}
.frac-big{display:inline-flex;flex-direction:column;align-items:center;font-size:4rem;font-weight:900;margin-bottom:30px}
.frac-big .fn{border-bottom:5px solid #2563EB;padding:0 24px 10px;color:#2563EB}
.frac-big .fd{padding:10px 24px 0;color:#111827}
.math-expr{display:flex;align-items:center;gap:20px;font-size:3.5rem;font-weight:900;color:#111827;margin-bottom:40px}
.math-block{background:#fff;border-radius:20px;padding:16px 28px;border:3px solid #e2e8f0;box-shadow:0 6px 15px rgba(0,0,0,.04)}
.angle-card{display:flex;flex-direction:column;align-items:center;margin-bottom:30px}
.angle-svg{filter:drop-shadow(0 10px 15px rgba(0,0,0,.08));margin-bottom:20px}
.angle-deg{font-size:3rem;font-weight:900;color:#2563EB}
.pref-card{background:#F8FAFC;border-radius:24px;padding:30px 40px;margin-bottom:30px;text-align:center;border:2px solid #e2e8f0}
.pref-q{font-size:1.5rem;font-weight:700;color:#64748b;margin-bottom:15px}
.pref-word{font-size:3rem;font-weight:900;color:#2563EB}
.biome-card{text-align:center;margin-bottom:30px}
.biome-animal{font-size:5rem;display:block;margin-bottom:10px}
.biome-name{font-size:2rem;font-weight:800;color:#111827}
.div-display{font-size:3.5rem;font-weight:900;color:#111827;margin-bottom:20px;text-align:center}
.div-q{font-size:1.3rem;font-weight:700;color:#64748b;margin-bottom:30px;text-align:center}
.sent-card{background:#F8FAFC;border-radius:20px;padding:25px 35px;margin-bottom:25px;font-size:1.8rem;font-weight:700;color:#111827;text-align:center;border:2px solid #e2e8f0}
.sent-opts{display:flex;flex-direction:column;gap:15px;width:100%}
.sent-part-btn{padding:16px 24px;font-size:1.1rem;font-weight:700;background:#fff;border:3px solid #e2e8f0;border-radius:16px;cursor:pointer;transition:all .2s;text-align:left}
.sent-part-btn:hover{border-color:var(--blue);background:#EFF6FF;transform:translateX(6px)}
.roman-display{font-size:6rem;font-weight:900;color:#111827;margin-bottom:40px;font-family:serif;letter-spacing:.1em}
.organ-card{text-align:center;margin-bottom:30px}
.organ-emoji{font-size:6rem;display:block;margin-bottom:10px}
.organ-name{font-size:2rem;font-weight:800;color:#111827}
.sys-btn{padding:14px 26px;font-size:1rem;font-weight:800;border-radius:16px;cursor:pointer;transition:all .2s;border:3px solid transparent}
.sys-btn.dig{background:#FEF3C7;color:#92400E;border-color:#FCD34D}
.sys-btn.res{background:#DBEAFE;color:#1E40AF;border-color:#93C5FD}
.sys-btn.cir{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.sys-btn.ner{background:#EDE9FE;color:#5B21B6;border-color:#C4B5FD}
.sys-btn.loc{background:#D1FAE5;color:#065F46;border-color:#6EE7B7}
.sys-btn:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 20px rgba(0,0,0,.1)}
.ops-expr{font-size:4rem;font-weight:900;color:#111827;margin-bottom:40px;padding:20px 40px;background:#fff;border-radius:20px;border:3px solid #e2e8f0;box-shadow:0 6px 15px rgba(0,0,0,.04)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-content{background:#fff;padding:50px 40px;border-radius:30px;text-align:center;max-width:450px;width:90%;box-shadow:0 25px 50px rgba(0,0,0,.25)}
.modal-icon{font-size:80px;margin-bottom:20px;background:linear-gradient(135deg,#F59E0B,#FCD34D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-content h2{font-size:2.5rem;color:#111827;margin-bottom:10px;font-weight:800}
.modal-content p{font-size:1.1rem;color:#64748b;margin-bottom:30px}
.btn-primary{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-size:1.2rem;font-weight:800;border-radius:99px;cursor:pointer;box-shadow:0 10px 20px rgba(59,130,246,.3);transition:all .2s;text-decoration:none}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 15px 25px rgba(59,130,246,.4)}
.fade-enter-active,.fade-leave-active{transition:opacity .5s ease}
.fade-enter-from,.fade-leave-to{opacity:0}
[v-cloak]{display:none}
</style>
</head>
<body>
<div class="bg-container"><img src="/static/videos/fondo.webp" alt="" class="bg-webp" aria-hidden="true"/></div>
<div class="bg-blur"></div>
<header class="header">
  <a href="/" class="logo"><img src="/static/images/gulu-icon.jpeg" alt="Gulu"/><span>gulugulu</span></a>
  <a href="/minijuegos" class="header-link"><span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>Grados</a>
</header>
<div id="game-app" v-cloak>
  <div class="top-bar">
    <div class="level-info"><h1>[[ config.title ]]</h1><p>Juego [[ gameId ]] de 10 &bull; Cuarto Grado</p></div>
    <div class="stats">
      <div class="stat-box" v-if="config.showScore"><span>Puntos</span><strong>[[ score ]]/[[ config.maxScore ]]</strong></div>
      <div class="stat-box hi"><span>Tiempo</span><strong>[[ fmtTime ]]</strong></div>
    </div>
  </div>
  <div class="canvas" id="canvas-area" v-if="!gameWon">

    <!-- G1: Fracciones Equivalentes -->
    <template v-if="gameId===1">
      <div class="prompt">¿Cuál es equivalente a esta fracción?</div>
      <div class="frac-big"><span class="fn">[[ g1.frac.split('/')[0] ]]</span><span class="fd">[[ g1.frac.split('/')[1] ]]</span></div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g1.opts" :key="o" @click="pG1(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G2: Multiplicación 2 cifras -->
    <template v-if="gameId===2">
      <div class="prompt">¿Cuánto es?</div>
      <div class="math-expr"><div class="math-block">[[ g2.a ]]</div><span>×</span><div class="math-block">[[ g2.b ]]</div><span>=</span><span style="color:#CBD5E1">?</span></div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g2.opts" :key="o" @click="pG2(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G3: Ángulos -->
    <template v-if="gameId===3">
      <div class="prompt">¿Qué tipo de ángulo es este?</div>
      <div class="angle-card">
        <svg class="angle-svg" width="200" height="160" viewBox="0 0 200 160">
          <line x1="100" y1="140" x2="20" y2="140" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
          <line x1="100" y1="140" :x2="100+80*Math.cos((180-g3.data[g3.idx].angle)*Math.PI/180)" :y2="140-80*Math.sin((180-g3.data[g3.idx].angle)*Math.PI/180)" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
          <text x="130" y="120" font-size="16" font-weight="700" fill="#2563EB">[[ g3.data[g3.idx].angle ]]°</text>
        </svg>
      </div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g3.data[g3.idx].opts" :key="o" @click="pG3(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G4: Prefijos y Sufijos -->
    <template v-if="gameId===4">
      <div class="prompt">[[ g4.data[g4.idx].q ]]</div>
      <div class="pref-card"><div class="pref-word">[[ g4.data[g4.idx].result ]]</div></div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g4.data[g4.idx].opts" :key="o" @click="pG4(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G5: Biomas -->
    <template v-if="gameId===5">
      <div class="prompt">¿En qué bioma vive?</div>
      <div class="biome-card"><span class="biome-animal">[[ g5.data[g5.idx].animal.split(' ')[1] ]]</span><div class="biome-name">[[ g5.data[g5.idx].animal ]]</div></div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g5.data[g5.idx].opts" :key="o" @click="pG5(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G6: División con Residuo -->
    <template v-if="gameId===6">
      <div class="prompt">¿Cuál es el RESIDUO de esta división?</div>
      <div class="div-display">[[ g6.a ]] ÷ [[ g6.b ]]</div>
      <div class="div-q">Cociente: [[ g6.q ]] — ¿Cuánto sobra?</div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g6.opts" :key="o" @click="pG6(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G7: Sujeto y Predicado -->
    <template v-if="gameId===7">
      <div class="prompt">¿Cuál es el SUJETO de la oración?</div>
      <div class="sent-card">"[[ g7.data[g7.idx].sent ]]"</div>
      <div class="sent-opts">
        <button class="sent-part-btn" @click="pG7(g7.data[g7.idx].subject,$event)">🏷️ [[ g7.data[g7.idx].subject ]]</button>
        <button class="sent-part-btn" @click="pG7(g7.data[g7.idx].predicate,$event)">⚡ [[ g7.data[g7.idx].predicate ]]</button>
      </div>
    </template>

    <!-- G8: Números Romanos -->
    <template v-if="gameId===8">
      <div class="prompt">¿A qué número equivale?</div>
      <div class="roman-display">[[ g8.roman ]]</div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g8.opts" :key="o" @click="pG8(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G9: Cuerpo Humano -->
    <template v-if="gameId===9">
      <div class="prompt">¿A qué sistema pertenece?</div>
      <div class="organ-card"><span class="organ-emoji">[[ g9.data[g9.idx].organ.split(' ')[1] ]]</span><div class="organ-name">[[ g9.data[g9.idx].organ ]]</div></div>
      <div class="opts" style="gap:12px">
        <button class="sys-btn dig" v-if="g9.data[g9.idx].opts.includes('Digestivo')" @click="pG9('Digestivo',$event)">🫃 Digestivo</button>
        <button class="sys-btn res" v-if="g9.data[g9.idx].opts.includes('Respiratorio')" @click="pG9('Respiratorio',$event)">🫁 Respiratorio</button>
        <button class="sys-btn cir" v-if="g9.data[g9.idx].opts.includes('Circulatorio')" @click="pG9('Circulatorio',$event)">❤️ Circulatorio</button>
        <button class="sys-btn ner" v-if="g9.data[g9.idx].opts.includes('Nervioso')" @click="pG9('Nervioso',$event)">🧠 Nervioso</button>
        <button class="sys-btn loc" v-if="g9.data[g9.idx].opts.includes('Locomotor')" @click="pG9('Locomotor',$event)">🦴 Locomotor</button>
      </div>
    </template>

    <!-- G10: Orden de Operaciones -->
    <template v-if="gameId===10">
      <div class="prompt">Respeta el orden de operaciones</div>
      <div class="ops-expr">[[ g10.expr ]] = ?</div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g10.opts" :key="o" @click="pG10(o,$event)">[[ o ]]</button></div>
    </template>

  </div>
  <transition name="fade">
    <div class="modal-overlay" v-show="gameWon">
      <div class="modal-content" id="vm">
        <span class="material-symbols-outlined modal-icon">stars</span>
        <h2>¡Brillante!</h2><p>¡Completado en [[ fmtTime ]]!</p>
        <a v-if="gameId<10" :href="'/juego/4/'+(gameId+1)" class="btn-primary">Siguiente Juego <span class="material-symbols-outlined">arrow_forward</span></a>
        <a v-else href="/minijuegos" class="btn-primary">¡Completaste Todo! <span class="material-symbols-outlined">check_circle</span></a>
      </div>
    </div>
  </transition>
</div>
<script>const GAME_ID = parseInt("{{ game_id|default(1) }}", 10);</script>
<script src="/static/js/grado4.js"></script>
</body>
</html>
