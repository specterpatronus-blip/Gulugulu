<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Minijuegos 5º Grado - Gulugulu</title>
<link rel="icon" href="/static/images/icono.png" type="image/png">
<link href="/static/css/fonts/plus-jakarta-sans.css" rel="stylesheet"/>
<link href="/static/css/fonts/material-symbols.css" rel="stylesheet"/>
<script src="/static/js/vue.global.js"></script>
<script src="/static/js/gsap.min.js"></script>
<script src="/static/js/confetti.browser.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gulu:#5A9AB5;--gulu-dark:#2C4A58;--gulu-accent:#6366f1;--text:#1A2E35;--glass:rgba(255,255,255,.85);--hglass:rgba(255,255,255,.7);--purple:#8B5CF6}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fbff;color:var(--text);overflow-x:hidden;min-height:100vh}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer;border:none}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.bg-container{position:fixed;inset:0;z-index:-3;overflow:hidden}
.bg-webp{width:100%;height:100%;object-fit:cover}
.bg-blur{position:fixed;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.1) 40%,transparent 100%);pointer-events:none}
.header{position:sticky;top:0;z-index:100;padding:12px 24px;backdrop-filter:blur(15px) saturate(180%);background:var(--hglass);border-bottom:1px solid rgba(255,255,255,.4);box-shadow:0 4px 30px rgba(0,0,0,.03);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}.logo:hover{transform:scale(1.02)}
.logo img{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.logo span{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--gulu),var(--gulu-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-link{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:14px;font-size:.85rem;font-weight:700;color:var(--gulu-dark);border:1px solid rgba(0,0,0,.05);background:rgba(255,255,255,.4);backdrop-filter:blur(5px);transition:all .3s}
.header-link:hover{background:#fff;transform:translateY(-2px);box-shadow:0 8px 15px rgba(0,0,0,.05);border-color:var(--gulu)}
#game-app{max-width:1000px;margin:40px auto;padding:20px;position:relative;z-index:1}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(20px);padding:20px 30px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.05);border:1px solid rgba(255,255,255,.8);margin-bottom:40px}
.level-info h1{font-size:2rem;font-weight:800;color:#7C3AED;margin-bottom:4px}
.level-info p{font-size:1rem;color:#64748b;font-weight:600}
.stats{display:flex;gap:20px}
.stat-box{background:#fff;padding:10px 20px;border-radius:16px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.04);border:2px solid #e2e8f0}
.stat-box.hi{border-color:var(--purple);background:#F5F3FF}
.stat-box span{font-size:.85rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.stat-box strong{font-size:1.5rem;font-weight:800;color:var(--text)}
.canvas{background:var(--glass);backdrop-filter:blur(10px);border-radius:30px;padding:50px;min-height:500px;box-shadow:0 15px 50px rgba(0,0,0,.05);border:2px solid rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.prompt{font-size:2rem;font-weight:800;color:#111827;text-align:center;margin-bottom:30px}
.sub-prompt{font-size:1.1rem;font-weight:700;color:#64748b;margin-bottom:20px;text-align:center}
.opts{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.btn-opt{padding:18px 36px;font-size:1.6rem;font-weight:800;background:#fff;border:4px solid #CBD5E1;border-radius:20px;color:var(--text);box-shadow:0 8px 15px rgba(0,0,0,.05);transition:all .2s cubic-bezier(.16,1,.3,1)}
.btn-opt:hover{transform:translateY(-5px);border-color:var(--purple);box-shadow:0 15px 25px rgba(139,92,246,.2);color:var(--purple)}
.btn-opt.sm{font-size:1.1rem;padding:14px 24px}
.power-expr{font-size:5rem;font-weight:900;color:#111827;margin-bottom:40px}
.power-sup{font-size:2.5rem;vertical-align:super;color:#7C3AED}
.pct-card{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:40px}
.pct-big{font-size:4rem;font-weight:900;color:#7C3AED}
.pct-of{font-size:2rem;font-weight:700;color:#64748b}
.pct-total{font-size:4rem;font-weight:900;color:#111827}
.method-board{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:25px}
.method-chip{padding:14px 22px;font-size:1.05rem;font-weight:700;background:#fff;border:3px solid #e2e8f0;border-radius:99px;cursor:pointer;transition:all .2s;box-shadow:0 4px 10px rgba(0,0,0,.05)}
.method-chip:hover{transform:translateY(-4px);border-color:var(--purple);box-shadow:0 10px 20px rgba(139,92,246,.15)}
.method-chip.placed{opacity:.3;pointer-events:none;background:#F1F5F9}
.progress-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.prog-chip{padding:8px 16px;font-size:.9rem;font-weight:700;background:linear-gradient(135deg,var(--purple),#7C3AED);color:#fff;border-radius:99px;box-shadow:0 4px 10px rgba(139,92,246,.3)}
.factor-card{background:#F5F3FF;border:2px solid #DDD6FE;border-radius:20px;padding:25px 40px;margin-bottom:30px;text-align:center}
.factor-q{font-size:1.4rem;font-weight:700;color:#64748b;margin-bottom:10px}
.factor-n{font-size:4rem;font-weight:900;color:#7C3AED}
.text-card{background:#F8FAFC;border-radius:20px;padding:25px 35px;margin-bottom:30px;font-size:1.2rem;font-weight:600;color:#374151;font-style:italic;text-align:center;border:2px solid #e2e8f0;max-width:600px;line-height:1.5}
.eco-card{text-align:center;margin-bottom:30px}
.eco-feature{font-size:1.5rem;font-weight:700;color:#64748b;padding:20px 30px;background:#F8FAFC;border-radius:16px;border:2px solid #e2e8f0}
.area-card{text-align:center;margin-bottom:30px}
.shape-label{font-size:1.4rem;font-weight:700;color:#64748b;margin-bottom:20px}
.shape-rect{display:flex;flex-direction:column;align-items:center}
.rect-svg{filter:drop-shadow(0 8px 12px rgba(139,92,246,.2))}
.prob-card{background:#F5F3FF;border:2px solid #DDD6FE;border-radius:20px;padding:25px 35px;margin-bottom:30px;font-size:1.3rem;font-weight:700;color:#374151;text-align:center;max-width:550px;line-height:1.5}
.prob-btn{padding:16px 30px;font-size:1.1rem;font-weight:800;border-radius:20px;cursor:pointer;transition:all .2s;border:3px solid transparent}
.prob-btn.seg{background:#D1FAE5;color:#065F46;border-color:#6EE7B7}
.prob-btn.pro{background:#FEF3C7;color:#92400E;border-color:#FCD34D}
.prob-btn.imp{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.prob-btn:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 20px rgba(0,0,0,.1)}
.tri-card{text-align:center;margin-bottom:30px}
.tri-svg{margin:0 auto 20px;display:block}
.tri-label{font-size:1.2rem;font-weight:700;color:#64748b}
.chem-card{text-align:center;margin-bottom:30px}
.chem-sub{font-size:2.5rem;font-weight:900;color:#111827;margin-bottom:10px}
.chem-type-btn{padding:16px 30px;font-size:1.1rem;font-weight:800;border-radius:20px;cursor:pointer;transition:all .2s;border:3px solid transparent}
.chem-type-btn.ele{background:#DBEAFE;color:#1E40AF;border-color:#93C5FD}
.chem-type-btn.comp{background:#D1FAE5;color:#065F46;border-color:#6EE7B7}
.chem-type-btn.mez{background:#FEF3C7;color:#92400E;border-color:#FCD34D}
.chem-type-btn:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 20px rgba(0,0,0,.1)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-content{background:#fff;padding:50px 40px;border-radius:30px;text-align:center;max-width:450px;width:90%;box-shadow:0 25px 50px rgba(0,0,0,.25)}
.modal-icon{font-size:80px;margin-bottom:20px;background:linear-gradient(135deg,#F59E0B,#FCD34D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-content h2{font-size:2.5rem;color:#111827;margin-bottom:10px;font-weight:800}
.modal-content p{font-size:1.1rem;color:#64748b;margin-bottom:30px}
.btn-primary{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;background:linear-gradient(135deg,#8B5CF6,#7C3AED);color:#fff;font-size:1.2rem;font-weight:800;border-radius:99px;cursor:pointer;box-shadow:0 10px 20px rgba(139,92,246,.3);transition:all .2s;text-decoration:none}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 15px 25px rgba(139,92,246,.4)}
.fade-enter-active,.fade-leave-active{transition:opacity .5s ease}
.fade-enter-from,.fade-leave-to{opacity:0}
[v-cloak]{display:none}
</style>
</head>
<body>
<div class="bg-container"><img src="/static/videos/fondo.webp" alt="" class="bg-webp" aria-hidden="true"/></div>
<div class="bg-blur"></div>
<header class="header">
  <a href="/" class="logo"><img src="/static/images/gulu-icon.jpeg" alt="Gulu"/><span>gulugulu</span></a>
  <a href="/minijuegos" class="header-link"><span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>Grados</a>
</header>
<div id="game-app" v-cloak>
  <div class="top-bar">
    <div class="level-info"><h1>[[ config.title ]]</h1><p>Juego [[ gameId ]] de 10 &bull; Quinto Grado</p></div>
    <div class="stats">
      <div class="stat-box" v-if="config.showScore"><span>Puntos</span><strong>[[ score ]]/[[ config.maxScore ]]</strong></div>
      <div class="stat-box hi"><span>Tiempo</span><strong>[[ fmtTime ]]</strong></div>
    </div>
  </div>
  <div class="canvas" id="canvas-area" v-if="!gameWon">

    <!-- G1: Potencias -->
    <template v-if="gameId===1">
      <div class="prompt">¿Cuánto vale esta potencia?</div>
      <div class="power-expr">[[ g1.base ]]<span class="power-sup">[[ g1.exp ]]</span></div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g1.opts" :key="o" @click="pG1(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G2: Porcentajes -->
    <template v-if="gameId===2">
      <div class="prompt">¿Cuánto es el porcentaje?</div>
      <div class="pct-card">
        <div class="pct-big">[[ g2.pct ]]%</div>
        <div class="pct-of">de</div>
        <div class="pct-total">[[ g2.total ]]</div>
      </div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g2.opts" :key="o" @click="pG2(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G3: Método Científico -->
    <template v-if="gameId===3">
      <div class="prompt">Ordena los pasos del método científico</div>
      <div class="method-board">
        <div class="method-chip" v-for="s in g3.shuffled" :key="s" :class="{placed:g3.placed.includes(s)}" @click="pG3(s)">[[ s ]]</div>
      </div>
      <div class="progress-row" v-if="g3.placed.length">
        <div class="prog-chip" v-for="(p,i) in g3.placed" :key="i">[[ i+1 ]]. [[ p ]]</div>
      </div>
    </template>

    <!-- G4: Factores y Múltiplos -->
    <template v-if="gameId===4">
      <div class="prompt">¿Cuál es un [[ g4.data[g4.idx].ask ]] de [[ g4.data[g4.idx].n ]]?</div>
      <div class="factor-card"><div class="factor-q">Número:</div><div class="factor-n">[[ g4.data[g4.idx].n ]]</div></div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g4.data[g4.idx].opts" :key="o" @click="pG4(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G5: Tipos de Texto -->
    <template v-if="gameId===5">
      <div class="prompt">¿Qué tipo de texto es este fragmento?</div>
      <div class="text-card">[[ g5.data[g5.idx].text ]]</div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g5.data[g5.idx].opts" :key="o" @click="pG5(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G6: Ecosistemas -->
    <template v-if="gameId===6">
      <div class="prompt">¿Qué ecosistema se describe?</div>
      <div class="eco-card"><div class="eco-feature">"[[ g6.data[g6.idx].feature ]]"</div></div>
      <div class="opts" style="gap:14px"><button class="btn-opt sm" v-for="o in g6.data[g6.idx].opts" :key="o" @click="pG6(o,$event)">[[ o ]]</button></div>
    </template>

    <!-- G7: Área -->
    <template v-if="gameId===7">
      <div class="prompt">¿Cuál es el área de este [[ g7.shape ]]?</div>
      <div class="area-card">
        <div class="shape-rect">
          <svg class="rect-svg" :width="g7.w*20+80" :height="g7.h*20+80" :viewBox="`0 0 ${g7.w*20+80} ${g7.h*20+80}`">
            <rect x="40" y="40" :width="g7.w*20" :height="g7.h*20" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3" rx="8"/>
            <text :x="40+g7.w*10" :y="40+g7.h*10+6" text-anchor="middle" font-size="18" font-weight="700" fill="#7C3AED">[[ g7.w ]] × [[ g7.h ]]</text>
            <text :x="40+g7.w*10" :y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">[[ g7.w ]] cm</text>
            <text x="20" :y="40+g7.h*10+6" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">[[ g7.h ]] cm</text>
          </svg>
        </div>
      </div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g7.opts" :key="o" @click="pG7(o,$event)">[[ o ]] cm²</button></div>
    </template>

    <!-- G8: Probabilidad -->
    <template v-if="gameId===8">
      <div class="prompt">¿Qué probabilidad tiene este evento?</div>
      <div class="prob-card">"[[ g8.data[g8.idx].event ]]"</div>
      <div class="opts" style="gap:16px">
        <button class="prob-btn seg" @click="pG8('Seguro',$event)">✅ Seguro</button>
        <button class="prob-btn pro" @click="pG8('Probable',$event)">🎲 Probable</button>
        <button class="prob-btn imp" @click="pG8('Imposible',$event)">❌ Imposible</button>
      </div>
    </template>

    <!-- G9: Ángulos del Triángulo -->
    <template v-if="gameId===9">
      <div class="prompt">¿Cuánto mide el ángulo que falta?</div>
      <div class="tri-card">
        <svg class="tri-svg" width="220" height="190" viewBox="0 0 220 190">
          <polygon points="110,20 20,170 200,170" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3" stroke-linejoin="round"/>
          <text x="110" y="14" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">?°</text>
          <text x="18" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">[[ g9.a ]]°</text>
          <text x="202" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">[[ g9.b ]]°</text>
        </svg>
        <div class="tri-label">La suma de los ángulos de un triángulo es 180°</div>
      </div>
      <div class="opts"><button class="btn-opt sm" v-for="o in g9.opts" :key="o" @click="pG9(o,$event)">[[ o ]]°</button></div>
    </template>

    <!-- G10: Química Básica -->
    <template v-if="gameId===10">
      <div class="prompt">¿Es un elemento, compuesto o mezcla?</div>
      <div class="chem-card"><div class="chem-sub">[[ g10.data[g10.idx].sub ]]</div></div>
      <div class="opts" style="gap:16px">
        <button class="chem-type-btn ele" @click="pG10('Elemento',$event)">⚛️ Elemento</button>
        <button class="chem-type-btn comp" @click="pG10('Compuesto',$event)">🔗 Compuesto</button>
        <button class="chem-type-btn mez" @click="pG10('Mezcla',$event)">🥗 Mezcla</button>
      </div>
    </template>

  </div>
  <transition name="fade">
    <div class="modal-overlay" v-show="gameWon">
      <div class="modal-content" id="vm">
        <span class="material-symbols-outlined modal-icon">stars</span>
        <h2>¡Genio!</h2><p>¡Completado en [[ fmtTime ]]!</p>
        <a v-if="gameId<10" :href="'/juego/5/'+(gameId+1)" class="btn-primary">Siguiente Juego <span class="material-symbols-outlined">arrow_forward</span></a>
        <a v-else href="/minijuegos" class="btn-primary">¡Completaste Todo! <span class="material-symbols-outlined">check_circle</span></a>
      </div>
    </div>
  </transition>
</div>
<script>const GAME_ID = parseInt("{{ game_id|default(1) }}", 10);</script>
<script src="/static/js/grado5.js"></script>
</body>
</html>
