<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Minijuegos 2º Grado - Gulugulu</title>
<link rel="icon" href="/static/images/icono.png" type="image/png">
<link href="/static/css/fonts/plus-jakarta-sans.css" rel="stylesheet"/>
<link href="/static/css/fonts/material-symbols.css" rel="stylesheet"/>
<script src="/static/js/vue.global.js"></script>
<script src="/static/js/gsap.min.js"></script>
<script src="/static/js/confetti.browser.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gulu:#5A9AB5;--gulu-dark:#2C4A58;--gulu-accent:#6366f1;--text:#1A2E35;--glass:rgba(255,255,255,.85);--hglass:rgba(255,255,255,.7);--orange:#F97316}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fbff;color:var(--text);overflow-x:hidden;min-height:100vh}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.bg-container{position:fixed;inset:0;z-index:-3;overflow:hidden}
.bg-webp{width:100%;height:100%;object-fit:cover}
.bg-blur{position:fixed;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.1) 40%,transparent 100%);pointer-events:none}
.header{position:sticky;top:0;z-index:100;padding:12px 24px;backdrop-filter:blur(15px) saturate(180%);background:var(--hglass);border-bottom:1px solid rgba(255,255,255,.4);box-shadow:0 4px 30px rgba(0,0,0,.03);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;transition:transform .3s ease}
.logo:hover{transform:scale(1.02)}
.logo img{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.logo span{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--gulu),var(--gulu-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-link{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:14px;font-size:.85rem;font-weight:700;color:var(--gulu-dark);border:1px solid rgba(0,0,0,.05);background:rgba(255,255,255,.4);backdrop-filter:blur(5px);transition:all .3s cubic-bezier(.16,1,.3,1)}
.header-link:hover{background:#fff;transform:translateY(-2px);box-shadow:0 8px 15px rgba(0,0,0,.05);border-color:var(--gulu)}
#game-app{max-width:1000px;margin:40px auto;padding:20px;position:relative;z-index:1}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(20px);padding:20px 30px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.05);border:1px solid rgba(255,255,255,.8);margin-bottom:40px}
.level-info h1{font-size:2rem;font-weight:800;color:#0056D2;margin-bottom:4px}
.level-info p{font-size:1rem;color:#64748b;font-weight:600}
.stats{display:flex;gap:20px}
.stat-box{background:#fff;padding:10px 20px;border-radius:16px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.04);border:2px solid #e2e8f0}
.stat-box.hi{border-color:var(--orange);background:#FFF7ED}
.stat-box span{font-size:.85rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.stat-box strong{font-size:1.5rem;font-weight:800;color:var(--text)}
.canvas{background:var(--glass);backdrop-filter:blur(10px);border-radius:30px;padding:50px;min-height:500px;box-shadow:0 15px 50px rgba(0,0,0,.05);border:2px solid rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.prompt{font-size:2.2rem;font-weight:800;color:#111827;text-align:center;margin-bottom:40px}
.sub-prompt{font-size:1.3rem;font-weight:700;color:#64748b;margin-bottom:30px;text-align:center}
.opts{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.btn-opt{padding:18px 36px;font-size:2rem;font-weight:800;background:#fff;border:4px solid #CBD5E1;border-radius:20px;color:var(--text);box-shadow:0 8px 15px rgba(0,0,0,.05);transition:all .2s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-opt:hover{transform:translateY(-5px);border-color:var(--orange);box-shadow:0 15px 25px rgba(249,115,22,.2);color:var(--orange)}
.btn-opt.sm{font-size:1.2rem;padding:14px 28px}
.big-num{font-size:5rem;font-weight:900;color:#0056D2;margin-bottom:10px}
.pair-card{background:#fff;border-radius:24px;padding:30px 50px;display:flex;gap:30px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.06);border:2px solid #e2e8f0;margin-bottom:40px}
.pair-word{font-size:2.5rem;font-weight:800;color:#111827;padding:15px 30px;background:#F8FAFC;border-radius:16px}
.pair-vs{font-size:1.5rem;font-weight:800;color:#94a3b8}
.btn-syn{padding:16px 32px;font-size:1.1rem;font-weight:800;border-radius:16px;transition:all .2s;cursor:pointer}
.btn-syn.yes{background:linear-gradient(135deg,#10B981,#059669);color:#fff;border:none;box-shadow:0 8px 20px rgba(16,185,129,.3)}
.btn-syn.no{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;border:none;box-shadow:0 8px 20px rgba(239,68,68,.3)}
.btn-syn:hover{transform:translateY(-3px) scale(1.05)}
.sum-display{display:flex;align-items:center;gap:20px;font-size:4rem;font-weight:900;color:#111827;margin-bottom:40px}
.sum-block{background:#fff;border-radius:20px;padding:20px 30px;border:3px solid #e2e8f0;box-shadow:0 6px 15px rgba(0,0,0,.04)}
.animal-card{text-align:center;margin-bottom:40px}
.animal-emoji{font-size:7rem;display:block;margin-bottom:10px}
.animal-name{font-size:1.8rem;font-weight:800;color:#111827}
.habitat-btn{padding:16px 28px;font-size:1.2rem;font-weight:800;border-radius:20px;border:3px solid transparent;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
.habitat-btn.mar{background:#DBEAFE;color:#1E40AF;border-color:#93C5FD}
.habitat-btn.bosque{background:#D1FAE5;color:#065F46;border-color:#6EE7B7}
.habitat-btn.desierto{background:#FEF3C7;color:#92400E;border-color:#FCD34D}
.habitat-btn.artico{background:#E0F2FE;color:#0C4A6E;border-color:#7DD3FC}
.habitat-btn:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 20px rgba(0,0,0,.1)}
.clock-face{font-size:8rem;margin-bottom:20px;filter:drop-shadow(0 10px 15px rgba(0,0,0,.1))}
.clock-time{font-size:1.5rem;font-weight:700;color:#64748b;margin-bottom:30px}
.word-card{text-align:center;margin-bottom:40px}
.word-emoji{font-size:6rem;display:block;margin-bottom:15px}
.word-text{font-size:3.5rem;font-weight:900;color:#0056D2;letter-spacing:.05em}
.class-btn{padding:18px 36px;font-size:1.2rem;font-weight:800;border-radius:20px;cursor:pointer;transition:all .2s;border:3px solid transparent}
.class-btn.sust{background:#EDE9FE;color:#5B21B6;border-color:#C4B5FD}
.class-btn.verb{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.class-btn.adj{background:#ECFDF5;color:#065F46;border-color:#6EE7B7}
.class-btn:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 20px rgba(0,0,0,.1)}
.cycle-board{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
.stage-chip{padding:16px 24px;font-size:1.3rem;font-weight:700;background:#fff;border:3px solid #e2e8f0;border-radius:99px;cursor:pointer;transition:all .2s;box-shadow:0 4px 10px rgba(0,0,0,.05)}
.stage-chip:hover{transform:translateY(-4px);border-color:var(--orange);box-shadow:0 10px 20px rgba(249,115,22,.15)}
.stage-chip.placed{opacity:.35;pointer-events:none;background:#F1F5F9}
.cycle-progress{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.progress-chip{padding:12px 20px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#10B981,#059669);color:#fff;border-radius:99px;box-shadow:0 4px 10px rgba(16,185,129,.3)}
.pv-number{display:flex;gap:8px;margin-bottom:40px}
.pv-digit{font-size:5rem;font-weight:900;width:100px;height:120px;display:flex;align-items:center;justify-content:center;border-radius:20px;border:4px solid}
.pv-digit.h{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.pv-digit.t{background:#DBEAFE;color:#1E40AF;border-color:#93C5FD}
.pv-digit.u{background:#D1FAE5;color:#065F46;border-color:#6EE7B7}
.pv-label{font-size:1.1rem;font-weight:700;color:#64748b;margin-bottom:30px;text-align:center}
.word-blank{display:flex;gap:8px;margin-bottom:40px;align-items:center}
.letter-box{font-size:3.5rem;font-weight:900;width:80px;height:90px;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid #CBD5E1;border-radius:16px}
.letter-box.blank{border-style:dashed;border-color:var(--orange);color:#94a3b8}
.mult-display{text-align:center;margin-bottom:40px}
.mult-expr{font-size:5rem;font-weight:900;color:#111827}
.mult-table{font-size:1.2rem;font-weight:700;color:#64748b;margin-top:10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-content{background:#fff;padding:50px 40px;border-radius:30px;text-align:center;max-width:450px;width:90%;box-shadow:0 25px 50px rgba(0,0,0,.25)}
.modal-icon{font-size:80px;margin-bottom:20px;background:linear-gradient(135deg,#F59E0B,#FCD34D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-content h2{font-size:2.5rem;color:#111827;margin-bottom:10px;font-weight:800}
.modal-content p{font-size:1.1rem;color:#64748b;margin-bottom:30px}
.btn-primary{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;background:linear-gradient(135deg,#F97316,#EA580C);color:#fff;font-size:1.2rem;font-weight:800;border-radius:99px;cursor:pointer;box-shadow:0 10px 20px rgba(249,115,22,.3);transition:all .2s;text-decoration:none}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 15px 25px rgba(249,115,22,.4)}
.fade-enter-active,.fade-leave-active{transition:opacity .5s ease}
.fade-enter-from,.fade-leave-to{opacity:0}
[v-cloak]{display:none}
@media(max-width:768px){
  .top-bar{flex-direction:column;gap:16px;text-align:center}
  .canvas{padding:30px 20px}
  .sum-display{font-size:2.5rem}
  .pair-card{flex-direction:column;gap:15px}
}
</style>
</head>
<body>
<div class="bg-container"><img src="/static/videos/fondo.webp" alt="" class="bg-webp" aria-hidden="true"/></div>
<div class="bg-blur"></div>

<header class="header">
  <a href="/" class="logo">
    <img src="/static/images/gulu-icon.jpeg" alt="Gulu"/>
    <span>gulugulu</span>
  </a>
  <a href="/minijuegos" class="header-link">
    <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>
    Grados
  </a>
</header>

<div id="game-app" v-cloak>
  <div class="top-bar">
    <div class="level-info">
      <h1>[[ config.title ]]</h1>
      <p>Juego [[ gameId ]] de 10 &bull; Segundo Grado</p>
    </div>
    <div class="stats">
      <div class="stat-box" v-if="config.showScore">
        <span>Puntos</span>
        <strong>[[ score ]]/[[ config.maxScore ]]</strong>
      </div>
      <div class="stat-box hi">
        <span>Tiempo</span>
        <strong>[[ fmtTime ]]</strong>
      </div>
    </div>
  </div>

  <div class="canvas" id="canvas-area" v-if="!gameWon">

    <!-- G1: Doble y Mitad -->
    <template v-if="gameId===1">
      <div class="prompt">¿Cuánto es [[ g1.label ]]?</div>
      <div class="big-num">[[ g1.num ]]</div>
      <div class="opts">
        <button class="btn-opt" v-for="o in g1.opts" :key="o" @click="pG1(o,$event)">[[ o ]]</button>
      </div>
    </template>

    <!-- G2: Sinónimos y Antónimos -->
    <template v-if="gameId===2">
      <div class="prompt">¿Son sinónimas o antónimas?</div>
      <div class="sub-prompt">Pregunta [[ g2.idx+1 ]] de 5</div>
      <div class="pair-card">
        <div class="pair-word">[[ g2.data[g2.idx].w1 ]]</div>
        <div class="pair-vs">↔</div>
        <div class="pair-word">[[ g2.data[g2.idx].w2 ]]</div>
      </div>
      <div class="opts">
        <button class="btn-syn yes" @click="pG2(true,$event)">✅ Sinónimas (igual)</button>
        <button class="btn-syn no" @click="pG2(false,$event)">❌ Antónimas (opuesto)</button>
      </div>
    </template>

    <!-- G3: Sumas con Llevada -->
    <template v-if="gameId===3">
      <div class="prompt">¿Cuánto es la suma?</div>
      <div class="sum-display">
        <div class="sum-block">[[ g3.a ]]</div>
        <span>+</span>
        <div class="sum-block">[[ g3.b ]]</div>
        <span>=</span>
        <span style="color:#CBD5E1">?</span>
      </div>
      <div class="opts">
        <button class="btn-opt sm" v-for="o in g3.opts" :key="o" @click="pG3(o,$event)">[[ o ]]</button>
      </div>
    </template>

    <!-- G4: Hábitats -->
    <template v-if="gameId===4">
      <div class="prompt">¿Dónde vive este animal?</div>
      <div class="animal-card">
        <span class="animal-emoji">[[ g4.animals[g4.idx].e ]]</span>
        <div class="animal-name">[[ g4.animals[g4.idx].n ]]</div>
      </div>
      <div class="opts" style="gap:16px">
        <button class="habitat-btn mar" @click="pG4('Mar',$event)">🌊 Mar</button>
        <button class="habitat-btn bosque" @click="pG4('Bosque',$event)">🌲 Bosque</button>
        <button class="habitat-btn desierto" @click="pG4('Desierto',$event)">🏜️ Desierto</button>
        <button class="habitat-btn artico" @click="pG4('Ártico',$event)">🧊 Ártico</button>
      </div>
    </template>

    <!-- G5: El Reloj Mágico -->
    <template v-if="gameId===5">
      <div class="prompt">¿Qué hora marca el reloj?</div>
      <div class="clock-face">🕐</div>
      <div class="clock-time">Las agujas marcan las <strong>[[ g5.h ]]</strong> y <strong>[[ g5.m===0?'en punto':g5.m+' minutos' ]]</strong></div>
      <div class="opts">
        <button class="btn-opt sm" v-for="o in g5.opts" :key="o" @click="pG5(o,$event)">[[ o ]]</button>
      </div>
    </template>

    <!-- G6: Clasifica la Palabra -->
    <template v-if="gameId===6">
      <div class="prompt">¿Qué tipo de palabra es?</div>
      <div class="sub-prompt">Palabra [[ g6.idx+1 ]] de 5</div>
      <div class="word-card">
        <span class="word-emoji">[[ g6.words[g6.idx].e ]]</span>
        <div class="word-text">[[ g6.words[g6.idx].w ]]</div>
      </div>
      <div class="opts" style="gap:16px">
        <button class="class-btn sust" @click="pG6('Sustantivo',$event)">🏷️ Sustantivo</button>
        <button class="class-btn verb" @click="pG6('Verbo',$event)">⚡ Verbo</button>
        <button class="class-btn adj" @click="pG6('Adjetivo',$event)">🎨 Adjetivo</button>
      </div>
    </template>

    <!-- G7: Ciclo de Vida -->
    <template v-if="gameId===7">
      <div class="prompt">Toca las etapas en el orden correcto</div>
      <div class="cycle-board">
        <div class="stage-chip" v-for="s in g7.shuffled" :key="s"
          :class="{placed: g7.placed.includes(s)}" @click="pG7(s)">[[ s ]]</div>
      </div>
      <div class="cycle-progress" v-if="g7.placed.length>0">
        <div class="progress-chip" v-for="(p,i) in g7.placed" :key="i">[[ i+1 ]]. [[ p ]]</div>
      </div>
    </template>

    <!-- G8: Valor Posicional -->
    <template v-if="gameId===8">
      <div class="prompt">¿Cuántas <strong>[[ g8.q ]]</strong> tiene este número?</div>
      <div class="pv-number">
        <div class="pv-digit h">[[ g8.h ]]</div>
        <div class="pv-digit t">[[ g8.t ]]</div>
        <div class="pv-digit u">[[ g8.u ]]</div>
      </div>
      <div class="pv-label">🟥 Centenas &nbsp;&nbsp; 🟦 Decenas &nbsp;&nbsp; 🟩 Unidades</div>
      <div class="opts">
        <button class="btn-opt" v-for="o in g8.opts" :key="o" @click="pG8(o,$event)">[[ o ]]</button>
      </div>
    </template>

    <!-- G9: Ortografía -->
    <template v-if="gameId===9">
      <div class="prompt">¿Qué letra falta?</div>
      <div class="word-blank">
        <div class="letter-box" v-for="(p,i) in g9.parts" :key="i" :class="{blank: p==='_'}">[[ p==='_'?'?':p ]]</div>
      </div>
      <div class="opts">
        <button class="btn-opt" v-for="l in g9.opts" :key="l" @click="pG9(l,$event)">[[ l ]]</button>
      </div>
    </template>

    <!-- G10: Tablas de Multiplicar -->
    <template v-if="gameId===10">
      <div class="prompt">Resuelve la multiplicación</div>
      <div class="mult-display">
        <div class="mult-expr">[[ g10.a ]] × [[ g10.mult ]] = ?</div>
        <div class="mult-table">Tabla del [[ g10.mult ]]</div>
      </div>
      <div class="opts">
        <button class="btn-opt sm" v-for="o in g10.opts" :key="o" @click="pG10(o,$event)">[[ o ]]</button>
      </div>
    </template>

  </div>

  <!-- Victory Modal -->
  <transition name="fade">
    <div class="modal-overlay" v-show="gameWon">
      <div class="modal-content" id="vm">
        <span class="material-symbols-outlined modal-icon">stars</span>
        <h2>¡Excelente Trabajo!</h2>
        <p>¡Lo lograste en [[ fmtTime ]]!</p>
        <a v-if="gameId<10" :href="'/juego/2/'+(gameId+1)" class="btn-primary">
          Siguiente Juego <span class="material-symbols-outlined">arrow_forward</span>
        </a>
        <a v-else href="/minijuegos" class="btn-primary">
          ¡Completaste Todo! <span class="material-symbols-outlined">check_circle</span>
        </a>
      </div>
    </div>
  </transition>
</div>

<script>const GAME_ID = parseInt("{{ game_id|default(1) }}", 10);</script>
<script src="/static/js/grado2.js"></script>
</body>
</html>
